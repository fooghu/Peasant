name: DLMM Range Check on: schedule: - cron: "*/5 * * * *" workflow_dispatch: {} jobs: check: runs-on: ubuntu-latest steps: - uses: actions/checkout@v4 - uses: actions/setup-python@v5 with: python-version: "3.11" - run: pip install -r requirements.txt - name: Check range env: RPC_URL: ${{ secrets.RPC_URL }} POOL_ADDRESS: ${{ secrets.POOL_ADDRESS }} MIN_BIN_ID: ${{ secrets.MIN_BIN_ID }} MAX_BIN_ID: ${{ secrets.MAX_BIN_ID }} TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }} TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }} run: python monitor.py
